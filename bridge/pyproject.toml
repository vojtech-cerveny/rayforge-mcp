[project]
name = "rayforge-mcp"
version = "0.1.0"
description = "MCP server that drives a running Rayforge through the mcp_bridge addon"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
rayforge-mcp = "rayforge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rayforge_mcp"]
